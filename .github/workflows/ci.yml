name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}${{ matrix.dependencies == 'lowest' && ' (lowest)' || '' }}
    runs-on: ubuntu-latest

    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: /tmp/error-monitor.sqlite
      CACHE_STORE: database

    strategy:
      fail-fast: false
      matrix:
        # Laravel 10 needs PHP >= 8.1, Laravel 11 and 12 need >= 8.2 and
        # Laravel 13 needs >= 8.3. The combinations the framework does not
        # support are simply not listed.
        #
        # Laravel 13 is additionally pinned to its lowest resolvable releases
        # once, because "^13.0" is a claim about 13.0, not about whatever
        # 13.x is newest on the day the job runs.
        include:
          - { php: '8.2', laravel: '10.*', testbench: '8.*' }
          - { php: '8.2', laravel: '11.*', testbench: '9.*' }
          - { php: '8.2', laravel: '12.*', testbench: '10.*' }
          - { php: '8.3', laravel: '10.*', testbench: '8.*' }
          - { php: '8.3', laravel: '11.*', testbench: '9.*' }
          - { php: '8.3', laravel: '12.*', testbench: '10.*' }
          - { php: '8.3', laravel: '13.*', testbench: '11.*' }
          - { php: '8.3', laravel: '13.*', testbench: '11.*', dependencies: 'lowest' }
          - { php: '8.4', laravel: '11.*', testbench: '9.*' }
          - { php: '8.4', laravel: '12.*', testbench: '10.*' }
          - { php: '8.4', laravel: '13.*', testbench: '11.*' }
          - { php: '8.5', laravel: '13.*', testbench: '11.*' }

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, sqlite3, pdo_sqlite
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Pin the framework version
        run: >
          composer require --dev --no-interaction --no-update
          "laravel/framework:${{ matrix.laravel }}"
          "orchestra/testbench:${{ matrix.testbench }}"

      # This job answers "does the code still work on Laravel 10/11/12", which
      # requires installing framework releases that carry security advisories -
      # Composer blocks those during resolution from 2.9 on. The bypass is set
      # here only: it never reaches composer.json, so nothing weakens for anyone
      # installing this package. The `security` job below keeps the real gate.
      - name: Install dependencies
        run: >
          composer update --prefer-dist --no-interaction --no-progress
          ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}
        env:
          COMPOSER_NO_BLOCKING: 1

      - name: Run the test suite
        run: composer test

      # migrate, status and analyze are three separate PHP processes, so an
      # in-memory SQLite would be gone before the second one starts. A file
      # database is what makes the migration visible to the commands.
      - name: Prepare the SQLite database
        run: |
          rm -f "${DB_DATABASE}"
          touch "${DB_DATABASE}"

      - name: Migrate inside a Laravel application
        run: vendor/bin/testbench migrate --force

      - name: Run the Artisan commands
        run: |
          vendor/bin/testbench error-monitor:status
          # Exit code 4 means "the collectors ran and matched no log file",
          # which is the healthy answer for an application that has never
          # written one. Only a real failure (1, 2, 3) should fail the job.
          vendor/bin/testbench error-monitor:analyze --dry-run || [ "$?" -eq 4 ]

  quality:
    name: Code style and static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, sqlite3, pdo_sqlite
          coverage: none

      # No composer.lock is committed - a library resolves against whatever the
      # host application allows, and the matrix above is what pins versions.
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Check the code style
        run: composer format:test

      - name: Run the static analysis
        run: composer analyse

  security:
    name: Current dependency security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, sqlite3, pdo_sqlite
          coverage: none

      # Deliberately no COMPOSER_NO_BLOCKING here: this job is the security
      # gate. The compatibility matrix may install an advisory-carrying Laravel
      # 10 to prove the code still runs on it, but the newest resolvable set of
      # dependencies has to stay clean, and this is where that is enforced.
      - name: Install the current dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Audit the dependencies
        run: composer audit
