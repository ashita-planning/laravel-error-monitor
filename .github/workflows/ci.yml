name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Laravel 10 needs PHP >= 8.1, Laravel 11 and 12 need >= 8.2. The
        # combinations the framework does not support are simply not listed.
        include:
          - { php: '8.2', laravel: '10.*', testbench: '8.*' }
          - { php: '8.2', laravel: '11.*', testbench: '9.*' }
          - { php: '8.2', laravel: '12.*', testbench: '10.*' }
          - { php: '8.3', laravel: '10.*', testbench: '8.*' }
          - { php: '8.3', laravel: '11.*', testbench: '9.*' }
          - { php: '8.3', laravel: '12.*', testbench: '10.*' }
          - { php: '8.4', laravel: '11.*', testbench: '9.*' }
          - { php: '8.4', laravel: '12.*', testbench: '10.*' }

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, sqlite3, pdo_sqlite
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Pin the framework version
        run: >
          composer require --dev --no-interaction --no-update
          "laravel/framework:${{ matrix.laravel }}"
          "orchestra/testbench:${{ matrix.testbench }}"

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run the test suite
        run: composer test

      - name: Migrate inside a Laravel application
        run: vendor/bin/testbench migrate --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Run the Artisan commands
        run: |
          vendor/bin/testbench error-monitor:status
          vendor/bin/testbench error-monitor:analyze --dry-run
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

  quality:
    name: Code style and static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, sqlite3, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check the code style
        run: composer format:test

      - name: Run the static analysis
        run: composer analyse
