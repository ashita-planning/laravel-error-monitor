name: Codex issue agent

# Turns an issue into either a plan or a draft pull request.
#
# The issue body is untrusted input - anybody can open an issue on a public
# repository - so nothing here interpolates it into a shell command or a YAML
# expression. Tested PHP scripts read GitHub's JSON files, and the text only
# ever reaches Codex inside a prompt file as untrusted data.

on:
  issues:
    types: [opened, labeled]

# Never on a fork's code, and never with more access than the step needs.
permissions:
  contents: read

concurrency:
  # One run per issue. Not cancel-in-progress: cancelling an implementation
  # half way through could leave a branch pushed and no pull request, which is
  # harder to reason about than waiting.
  group: codex-issue-agent-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  decide:
    name: Decide what to do
    runs-on: ubuntu-latest
    # Belt and braces: this workflow is written for one repository and should
    # not start doing things in a fork of it.
    if: github.repository == 'ashita-planning/laravel-error-monitor'

    permissions:
      contents: read
      issues: read

    outputs:
      mode: ${{ steps.decision.outputs.mode }}
      reason: ${{ steps.decision.outputs.reason }}
      branch: ${{ steps.decision.outputs.branch }}
      plan_marker: ${{ steps.decision.outputs.plan_marker }}
      high_risk: ${{ steps.decision.outputs.high_risk }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Fetch the issue snapshot as data
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue view "$ISSUE" \
            --json number,title,body,authorAssociation,labels,comments \
            > "$RUNNER_TEMP/issue.json"

      - name: Decide
        id: decision
        env:
          ISSUE_SNAPSHOT_PATH: ${{ runner.temp }}/issue.json
        run: php .github/scripts/decide.php

      - name: Explain
        run: |
          echo "mode: ${{ steps.decision.outputs.mode }}"
          echo "reason: ${{ steps.decision.outputs.reason }}"

  plan:
    name: Propose a plan
    needs: decide
    if: needs.decide.outputs.mode == 'plan'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      # An unedited issue gets one plan, however often the workflow runs. The
      # marker changes when the body does, so a revised issue is planned again.
      - name: Skip if this revision was already planned
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER: ${{ needs.decide.outputs.plan_marker }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          if gh issue view "$ISSUE" --json comments --jq '.comments[].body' | grep -qF "$MARKER"; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "This revision of the issue already has a plan."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the planning prompt from the issue snapshot
        if: steps.guard.outputs.already == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue view "$ISSUE" --json number,title,body,comments > "$RUNNER_TEMP/issue.json"
          php .github/scripts/build-agent-prompt.php \
            plan "$RUNNER_TEMP/issue.json" "$RUNNER_TEMP/codex-plan-prompt.md"

      - name: Investigate and propose
        id: codex
        if: steps.guard.outputs.already == 'false'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/codex-plan-prompt.md
          model: gpt-5.6-terra
          effort: medium
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral"]'

      # The plan job must not be able to change the repository. If it did, the
      # approval gate would mean nothing.
      - name: Verify nothing was changed
        if: always() && steps.guard.outputs.already == 'false'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The planning job modified the working tree, which it must never do."
            git status --porcelain
            exit 1
          fi

      - name: Post the verified plan
        if: steps.guard.outputs.already == 'false'
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.codex.outputs.final-message }}
          MARKER: ${{ needs.decide.outputs.plan_marker }}
        with:
          github-token: ${{ github.token }}
          script: |
            if (!process.env.PLAN?.trim()) {
              core.setFailed('Codex returned an empty plan.');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${process.env.PLAN}\n\n${process.env.MARKER}`,
            });

  review-required:
    name: Stop and ask for a human
    needs: decide
    if: needs.decide.outputs.mode == 'review-required'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    steps:
      - name: Label and explain
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          CATEGORIES: ${{ needs.decide.outputs.high_risk }}
        run: |
          gh issue edit "$ISSUE" --add-label 'plan-review-required' || true
          gh issue comment "$ISSUE" --body "This issue touches an area that is never implemented automatically: \`$CATEGORIES\`.

          A wrong change here is worse than no change, so the agent stops before
          implementing and a person decides what happens next. Removing the
          \`plan-review-required\` label does not lift this: the check is on the
          subject of the issue, not on the label." 

  implement:
    name: Implement the approved plan
    needs: decide
    if: needs.decide.outputs.mode == 'implement'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, sqlite3, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Mark the issue as running
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE" --add-label 'ai-running' --remove-label 'ai-failed' || true

      # Everything happens on this branch. `main` is never checked out for
      # writing and never pushed to.
      - name: Create the working branch
        env:
          BRANCH: ${{ needs.decide.outputs.branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"

      - name: Build the implementation prompt from the issue snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          BRANCH: ${{ needs.decide.outputs.branch }}
        run: |
          gh issue view "$ISSUE" --json number,title,body,comments > "$RUNNER_TEMP/issue.json"
          php .github/scripts/build-agent-prompt.php \
            implement "$RUNNER_TEMP/issue.json" "$RUNNER_TEMP/codex-implement-prompt.md" "$BRANCH"

      - name: Implement
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/codex-implement-prompt.md
          model: gpt-5.6-terra
          effort: medium
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral"]'

      # The single most important guard in this file. Whatever happened above,
      # nothing is pushed unless we are on the branch we created.
      - name: Verify the branch before pushing
        id: verify
        env:
          BRANCH: ${{ needs.decide.outputs.branch }}
        run: |
          current="$(git rev-parse --abbrev-ref HEAD)"

          if [ "$current" != "$BRANCH" ]; then
            echo "::error::Expected to be on $BRANCH but found $current. Nothing will be pushed."
            exit 1
          fi

          case "$current" in
            ai/issue-*) ;;
            *) echo "::error::Refusing to push a branch outside ai/issue-*."; exit 1 ;;
          esac

          protected="$(git status --porcelain -- .github AGENTS.md)"
          if [ -n "$protected" ]; then
            echo "::error::Codex changed protected workflow or instruction files. Nothing will be pushed."
            echo "$protected"
            exit 1
          fi

          if [ -z "$(git status --porcelain)" ]; then
            echo "::error::Codex made no change."
            exit 1
          fi

      - name: Run the quality gate
        run: composer check

      - name: Commit the verified change
        id: commit
        env:
          ISSUE: ${{ github.event.issue.number }}
        run: |
          git add --all
          git commit -m "Implement approved plan for issue #$ISSUE"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push
        env:
          BRANCH: ${{ needs.decide.outputs.branch }}
        run: git push --force-with-lease origin "$BRANCH"

      - name: Open a draft pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.decide.outputs.branch }}
          ISSUE: ${{ github.event.issue.number }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          existing="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"

          if [ -n "$existing" ]; then
            echo "number=$existing" >> "$GITHUB_OUTPUT"
            echo "A pull request for this branch is already open."
            exit 0
          fi

          number="$(gh pr create \
            --draft \
            --base "$BASE" \
            --head "$BRANCH" \
            --title "Implement issue #$ISSUE" \
            --body "Automated implementation of the approved plan in #$ISSUE.

          Opened as a draft: a person reviews this before it is marked ready.
          The quality gate passed on the pushed commit." \
            | grep -oE '[0-9]+$')"

          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Report on the issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          SHA: ${{ steps.commit.outputs.sha }}
          PR: ${{ steps.pr.outputs.number }}
          BRANCH: ${{ needs.decide.outputs.branch }}
        run: |
          marker="<!-- ai-implementation:$ISSUE:$SHA -->"

          if gh issue view "$ISSUE" --json comments --jq '.comments[].body' | grep -qF "$marker"; then
            echo "This commit has already been reported."
            exit 0
          fi

          gh issue comment "$ISSUE" --body "Implemented on \`$BRANCH\` and opened as draft #$PR.

          - Commit: \`$SHA\`
          - \`composer check\` passed on that commit

          **Please check before marking the pull request ready:** that the change
          matches the approved plan and does not exceed it, that the new tests
          fail without the change, and that nothing in the diff touches an area
          the plan did not name.

          $marker"

      - name: Record the outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE" --remove-label 'ai-running' || true

          if [ "${{ job.status }}" = 'success' ]; then
            gh issue edit "$ISSUE" --add-label 'ai-done' || true
          else
            gh issue edit "$ISSUE" --add-label 'ai-failed' || true
            # Only the step and how to retry. Not the log, which can contain
            # anything the run happened to print.
            gh issue comment "$ISSUE" --body "The automated implementation did not finish.

          Nothing was merged, and \`main\` is untouched. Remove the \`ai-failed\`
          label and re-apply \`plan-approved\` to try again, or take it over by
          hand from the \`ai/issue-$ISSUE\` branch if it was pushed.

          The run log is linked from the checks on this issue's workflow run." || true
          fi
